modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

description='''
Adds multiblock display panels that can mirror written books, books and quills,
MineColonies resource scrolls, MineColonies clipboards, and the Colony Dashboard.
The active source is re-read automatically every five seconds so the wall keeps
itself up to date.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecolonies"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
